phic, drug taking, smoking, shameful, or other inappropriate situations, including child sexual abuse material (CSAM), etc.<br />iii) Share content that violates another person&rsquo;s contractual, personal, intellectual property or other rights.<br />For example, do not share content that violate the copyright of other person; do not act with intent to shame or degrade another individual; do not use material contains portrait of other person without consent of such person.<br />iv) Host, display, upload, modify, publish, transmit, store, update or share content which is not suitable for the user group of the Services, or is of negative social effects.<br />For example, do not share sexually explicit content (even if pornography or prostitution is lawful under applicable laws); do not share content glorifying or promoting self-harm or suicide; do not share content of animal cruelty; do not share content for sadistic pleasure; do not glorify or celebrate violence, hatred, Fascism, extremism, racism or discriminations (regardless of basing on race, ethnic origin, religion, disability, gender, age, nationality, veteran status, or sexual orientation or gender identity); do not upload or share content that belongs to someone else is defamatory, obscene, pornographic, paedophilic or invasive or another user&rsquo;s privacy.<br />v) Share content that is directly threatening someone&rsquo;s physical or financial state. For example, do not threaten to harm another person or someone related to another person in any capacity; do not tell other people you will hurt or kill them; do not share or threaten to share personal information of another user, including but not limited to home address, phone number, email, social security number, and photos.<br />vi) Distribute malicious content.<br />For example, do not distribute viruses, engage in or promote phishing activities, threaten another user with digital harm including but not limited to viruses, Trojans, hacking, and spying. ng, but not limited to, the placement of advertisements on any page of The Site); you also agree to receive promotional or other relevant commercial information from us via email, short message service (SMS) or other methods, to the extent permitted by applicable law.</p>\n<p>C. Nothing in this Agreement shall be deemed to confer any third-party rights or benefits.</p>\n<p>11. International Use and Export Control</p>\n<p>A. This Agreement may appear in different languages. If any discrepancy or inconsistency occurs between the versions of different languages, this English version shall always prevail.</p>\n<p>B. Software available in connection with the Services and the transmission of applicable data, if any, is subject to Singapore export controls. No software may be downloaded from the Services or otherwise exported or re-exported in violation of Singapore export laws. Downloading or using the software is at your sole risk. You hereby represent and warrant that (i) you are not located in a country that is subject to a Singapore government embargo, or that has been designated by the Singapore government as a &ldquo;terrorist supporting&rdquo; country; and (ii) You are not listed on any Singapore government list of prohibited or restricted parties.</p>\n<p>C. Recognizing the global nature of the Internet, you agree to comply with all local rules and laws regarding your use of the Service, including as it concerns online conduct and acceptable content. Particularly, you may not use or otherwise export or re-export the Services and its components except as authorized by United States (&ldquo;U.S.&rdquo;) law and the laws of the jurisdiction in which the Services was obtained. The software and applications comprise the Services may not be exported or re-exported into any U.S.-embargoed countries or to anyone on the U.S. Treasury Department&rsquo;s Specially Designated Nationals List or the U.S. Department of Commerce Denied Persons List or Entity List. By accessing and using the Services, you represent and warrant that you are not located in any such country or on any such list. You also agree that you will not use these products for any purposes prohibited by U.S. law, including, without limitation, the development, design, manufacture, or production of nuclear, missile, or chemical or biological weapons.</p>\n</div>",
  "privacy": "<div style=\"font-size: 14px; direction: ltr; color: #000; font-weight: 400; line-height: 1.2; font-family: system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',sans-serif; -webkit-tap-highlight-color: transparent;\" data-wrap=\"\">\n<p style=\"text-align: center;\"><span style=\"font-size: 16px;\"><strong>Privacy Policy</strong></span></p>\n<p><em>Last updated:&nbsp;</em><em>[</em><em>0</em><em>8</em><em>th/</em><em>1</em><em>1</em><em>/2024]</em></p>\n<p>Welcome to&nbsp;TiLike!</p>\n<p>We present our users with&nbsp;an online and mobile messaging and social networking platform via a mobile application (the &ldquo;App&rdquo;), the&nbsp;<a href=\"https://www.tilike.net/\">https://www.tilike.net </a>website (the &ldquo;Site&rdquo;), and related Internet services (collectively, the &ldquo;Services&rdquo;). The Services are operated by Chivalyouth Technoloy Pte. Ltd. (the &ldquo;we&rdquo; or &ldquo;us&rdquo;) for users of the Services, including you (&ldquo;you&rdquo;). This Privacy Policy is incorporated into, and is subject to, our&nbsp;<a href=\"https://www.tilike.net/a/license/tilike-user.html\" target=\"_blank\" rel=\"noopener noreferrer\" rel=\"noopener\"><u>Terms of Service</u></a>&nbsp;(the &ldquo;Terms&rdquo;). Capitalized terms that are not defined in this Privacy Policy (&ldquo;Policy&rdquo;) shall have the meaning given to them in the Terms.</p>\n<p>We are fully aware of the importance of personal information to you and will do our best to protect the security and reliability of your personal information. We will not use or share your information with anyone except as described in this Privacy Policy. This Privacy Policy does not apply to information we collect by other means (including offline) or from other sources. Before using our products or Services, please be sure to read and fully understand this&nbsp;Privacy Policy.&nbsp;Particularly,&nbsp;you should pay close attention to&nbsp;the&nbsp;<strong>bolded</strong>&nbsp;clauses, which may relate to your rights.&nbsp;Please&nbsp;only continue to use our products and Services after confirming that you fully understand and agree&nbsp;to our Terms and this Privacy Policy. Once you start using the App, Site, or other Services, you will be deemed to have fully understood and agreed with the provisions of this Privacy Policy. If you do not or no longer agree with this Privacy Policy, please stop your access and use of the App, Site, and other Services.</p>\n<p><strong>I</strong><strong>.INFORMATION WE COLLECT &amp; HOW WE COLLECT YOUR INFORMATION</strong></p>\n<p>1.Information We Collect</p>\n<p>As long as quality of the Services can be guaranteed, we will endeavor to collect as little of your personal information as possible. The information we collect from you for the performance of our Services are as follows:</p>\n<ul>\n<li>Account information: Such as phone number, email address, login password, third-party account information.</li>\n<li>Device Information: Such as device ID, operating system, IP address, country code, device type and versions, mobile network operator, etc.</li>\n<li>Your Profile Information: Such as profile photo, date of birth, gender, nickname, personalized signature, longitude and latitude, geological location, etc.</li>\n<li>Contacts: Your contacts.</li>\n<li>User Content &amp; Behavior Information: Such as browsing history, searching history, friend list, comments, messages, audio-video streaming data, etc.</li>\n<li>Virtual Currency &amp; Payment Information: order number, recharge information, payment method, virtual currency balance, user props and rights, etc.</li>\n<li>Other data inferred from or associated with any of the above, such as any metadata accompanying user generated content, audio-visual clips segmentation, annotation, frame or text extraction, object and image recognition symbolling, aggregated classification tagging and other non-personally identifying information inferred from data you provide to us or that we collect about you in connection with your use of the Services. If the App crashes or stops responding, we may collect or trace your log information output produced by the traces.txt file in the &ldquo;/ data/ anr/ directory&rdquo; of the system. Such data we collected for app crash will be uploaded to&nbsp;https://crash-reporting.tilike.net</li>\n<li>Answers for retrieving your account password: You may choose to set password retrieving questions and in that case, the answer you set as answers for the verification questions will be collected, such information may include: Part of your ID number, your birthday or your parents&rsquo; birthday, etc. These information will only be collected when you set them as the answers for password retrieving.</li>\n</ul>\n<p>You may refer to&nbsp;<u>Appendix 1</u>&nbsp;of this Privacy Policy for more details about information we collect from you.</p>\n<p>2.How We Collect Your Information</p>\n<p>A.Information we collect from you. We collect information that you voluntarily submit or provide to us, including (without limitation) when you download our App, create an account, interact with any of the Services, or otherwise contact us with a question, comment, feedback or request.</p>\n<p>B.Information we collect from your device.&nbsp;<strong>We, and our service providers, may automatically collect certain network and device information from your computer or mobile device once you activate our Services, such as your IP address, your geographic location, operating system, model of your device, etc.</strong>This information allows us to recognize you and personalize your experience if you return to the Services. We, and our service providers, may collect this information using &ldquo;cookies&rdquo;. More information about our use of cookies can be found in the &ldquo;Cookies&rdquo; section below. We may automatically collect such information over time and across different websites or Services or across different devices from which you log onto or access our Services by.</p>\n<p>You may refer to&nbsp;<u>Appendix 2</u>&nbsp;of this Privacy Policy for more details on the information we collect from your devices.</p>\n<p>C.Information obtained from third parties. You may give us permission to collect your information from third parties and other sources, or the services provided by them (this may include social networking services, creator agencies, web hosting providers, analytics providers, attribution providers, advertising or other business partners and/or other public resources). To the extent that we allow third party social media integration in the Services, the information we may obtain from third party services depends on your account/privacy settings with those third parties and the privacy policies of such third parties. If you access the Services through third party platforms, you are authorizing us to collect, store and use such information and content in accordance with this Policy. For example, you may connect a social networking service such as Facebook or Google to the account you are opening or have opened with us. When you do this, you may allow us to obtain your information from those accounts, such as your friends or contacts.</p>\n<p><strong>Ⅱ.HOW WE USE AND DISCLOSE YOUR INFORMATION</strong></p>\n<p>1.How We Use Your Information</p>\n<p>We use the information you provide in a manner that is consistent with this Privacy Policy. Generally, we use the information that we have collected to operate and maintain our Services and to respond to your requests and concerns. If you provide information for a certain reason, we will use the information in connection with the reason for which it was provided. Below are some ways in which we use your information:</p>\n<ul>\n<li>to verify your age and make sure our Services is proper for you;</li>\n<li>improve, promote and develop the Services;</li>\n<li>notify you about changes to our Services;</li>\n<li>communicate with you and provide you with user support;</li>\n<li>enable you to share user content and interact with other users;</li>\n<li>enable our messenger service to function (if you choose to use this function);</li>\n<li>enable you to participate in activities on our App or Site or any other Services;&nbsp;</li>\n<li>allow you to participate in interactive features of the App;</li>\n<li>help us detect and combat abuse, harmful activity, fraud, spam, and illegal activity;</li>\n<li>ensure your safety and security including reviewing user content, messages and associated metadata for breach of our&nbsp;Community Guidelines and other inappropriate content;</li>\n<li>carry out data analysis and test the Services to ensure its stability and security;</li>\n<li>to ensure that you are old enough to use our Services (as required by law);</li>\n<li>ensure content is presented in the most effective manner for you and your device;</li>\n<li><strong>personalize the content you receive and provide you with tailored content that will be of interest to you;</strong></li>\n<li><strong>provide you with personalized advertising (upon your express consent);</strong></li>\n<li>provide you with location-based services (where those services are available in your jurisdiction);</li>\n<li>enforce our terms, conditions and policies;&nbsp;</li>\n<li>administer the App including troubleshooting.</li>\n</ul>\n<p>2. How We Disclose and Share Your Information</p>\n<p>We are not in the business of selling your information. We consider this information to be a vital part of our relationship with you. However, we may share your information with certain third parties under certain circumstances, as described below.</p>\n<p>A. Selected third Parties. We sometimes engage other companies or individuals to perform certain business-related functions, including business partners, payment providers, service providers, analytics providers, advertisers/advertising networks, etc. Your information may be provided to them for such functions including, without limitation, payment processing, technology maintenance, and professional analysis.</p>\n<p>B. Our affiliates or group members: We may also share your information with other members, subsidiaries, or affiliates of our corporate group, to provide the Services to you, including improving and optimizing the platform, preventing illegal use,facilitating your use of our Affiliated Products, etc.</p>\n<p>C. Law Enforcement: We will share your information with law enforcement agencies, public authorities or other organizations if we are legally required to do so, or if such use is reasonably necessary to: 1) comply with any legal obligations, processes or requests; 2) enforce our Terms of Service and other agreements, policies, and standards, including investigating any potential breach thereof; 3) detect, prevent or otherwise address security, fraud or technical issues; or 4) protect the rights, property or security, of ourselves, our users, a third party or the public as required or permitted by law.</p>\n<p>D. Public content: You may submit certain information or content through the Services, such as comments, feedback, audio clips, video clips, etc. Any such information that is meant to be shown to the public on our App will be disclosed publicly. This policy does not apply to uses of any such information by third parties.</p>\n<p><strong>III.&nbsp;</strong><strong>STORAGE AND PROCESSING OF YOUR INFORMATION</strong></p>\n<p>1. Storage of Your Information</p>\n<p>Your information collected through the Service may be processed and/or stored in, Singapore or any other country in which we, our service provider or affiliates maintain servers. We may transfer information that we collected about you, including personal information, from your country or jurisdiction to other countries or jurisdictions around the world in accordance with the laws of the country you live.</p>\n<p>2. Retention of Your Information</p>\n<p>If you have an account with us, we will retain your information for as long as your account is active or as needed to be ready to provide you services. We will retain and use your information as necessary to comply with our legal obligations, resolve disputes and enforce our agreements within the limits of applicable law.</p>\n<p>If you are a visitor or temporary user of our Services, we will retain your information for as long as necessary but no longer than as required by applicable laws after your last visit to our Services.</p>\n<p>To dispose of personal information, we may anonymize it, delete it or take other appropriate steps. Information may persist in copies made for backup and business continuity purposes for a longer time and will not be retained for longer than is required for the above-mentioned purposes or as otherwise required under the applicable laws.</p>\n<p>3. International Transfer of Your Information</p>\n<p>We may transfer your information to other countries or regions solely for the purposes set out in this Policy, in accordance with this Policy and applicable laws and regulations. Information disclosure as referred to in this Policy may involve a transfer of your information to countries and regions that provide different levels of data protection. Applicable legal and regulatory requirements are taken into consideration before any cross-border transfer of your information takes place.</p>\n<p>&nbsp;</p>\n<p><strong>IV.</strong><strong>HOW WE PROTECT YOUR INFORMATION</strong></p>\n<p>1. Protecting Your Privacy and Data is Our Priority</p>\n<p>We always take reasonable physical, technical or managerial measures to protect the information collected via the Services from loss, misuse, and unauthorized access, disclosure, alteration, or destruction. However, no method of transmission over the Internet or method of electronic storage, is one hundred percent secure. In particular, emails sent to or from the Services may not be secure. Therefore, you should take special care in deciding what information you send to us via email.</p>\n<p>2. Compromise of Personal Information</p>\n<p>In the event that your personal information is compromised in a breach of security, we will promptly notify you in compliance with the applicable law. If such breach of security is caused by any of the following reasons, you hereby agree that we shall, in no circumstance, be held liable:</p>\n<p>A. Government or judicial authorities seize data from us in compliance with applicable laws, regulatory policies, administrative or judicial orders, or on the basis of other lawful grounds;</p>\n<p>B. Disclosure or exposure of any personal information resulting from your own actions or omissions resulting in the sharing or leaking your account or password;</p>\n<p>C. Any information disclosure caused by hacking, computer virus, trojans or other cybercrimes, or system failure or telecommunication malfunction, where it is commercially impractical for current technology to prevent or withstand such incidents;</p>\n<p>D. In the event of an emergency, which endangers public safety or other person&rsquo;s life, health or property, your information may be disclosed to mitigate the situation. If your rights have been jeopardized as a result, you may claim compensation from the beneficiary of such event under applicable laws; and</p>\n<p>D. Any disclosure of your information under an event of force majeure, or for any other cause that is not attributable to us.</p>\n<p>&nbsp;</p>\n<p><strong>Ⅴ.YOUR RIGHTS ABOUT YOUR INFORMATION</strong></p>\n<p>1. General Rights</p>\n<p>Once you have completed your account registration and put in place reasonable and necessary authentication measures, you can review, modify, and delete the information you have submitted to us. In general, you can browse, modify, and delete your own information at any time, but you may not be able to modify certain information due to security or identification purposes.</p>\n<p>2. Rights under Different Jurisdictions</p>\n<p>As we provide our Services in many countries around the world, and the laws on data privacy varies from place to place, we have listed below the specific rights granted by different jurisdictions which may be applicable to you.</p>\n<p>A. Right to know. You have the right to be informed in a concise, transparent, intelligible and easily accessible form of the way in which your personal information is processed. You also have the right to obtain confirmation as to whether or not information concerning you is being processed.</p>\n<p>B.Right to access and copy. Where required by local laws, you shall have the right to obtain a copy of your data as long as it is technically and commercially practicable.</p>\n<p>C. Right to rectification/ deletion. You have the right to request to review, correct, update or delete most of information about you that we keep on file by logging into your account to update or delete your relevant information. You may also contact us via the contact information provided in below IX. CONTACTING US or Help Center or Feedback for any request to delete your personal information. Should you choose to do so, you may delete your entire account in Setting as per indicated below in Section G.</p>\n<p>D. Right to data portability. You have the right to data portability if it should become relevant and required by applicable laws.</p>\n<p>E. Right to withdraw your consent. Where you have provided your consent, you may withdraw your consent by managing your account settings or contacting us through the contact information provided in this Policy.&nbsp;<strong>You can also unsubscribe from certain emails and notifications by clicking the &ldquo;unsubscribe&rdquo; button or link or switching off relevant features</strong>. You can opt out from certain cookie-related processing by following the instructions given by the manual or help screen of your browsers.</p>\n<p>F. Right to change your privacy settings. You can change your privacy settings on our App, such as making your location/ gender/ age private.</p>\n<p>G. Right to cancel your account. If you no longer want to use our Services, and would like your account to be deregistered,</p>\n<p>For android users, you may cancel your account via &ldquo;Setting-Security Center -Cancel account&rdquo;, or &ldquo;Setting-Security Center-Account Security-Cancel account&rdquo;.</p>\n<p>For IOS users, you may cancel your account via &ldquo;Setting- Account Security-Delete your account&rdquo;</p>\n<p>You may also contact us via the contact information provided in this Policy, or visit the Account cancellation statement at<a href=\"https://www.tilive.net/a/delete-account/gp-delete.html\" target=\"_blank\" rel=\"noopener noreferrer\" rel=\"noopener\">&nbsp;<u>https://</u><u>tilike.net</u><u>/a/delete-account/gp-delete.html</u></a>&nbsp;, and we will provide you with further assistance and guide you through the process.</p>\n<p>However, please note that once you choose to delete your account, you will not be able to reactivate your account or retrieve any of the content or information associated or linked to that account.</p>\n<p>H. Right to complaint. In the event that you wish to make a complaint about how we process your personal data, please contact us in the first instance through the contact information provided in this Policy and we will endeavor to deal with your request as soon as possible. This is without prejudice to your right to launch a claim with the relevant data protection authority.</p>\n<p><strong>Unless otherwise indicated above, you can exercise any of the above rights, as applicable to you according to laws of your country, using the contact information provided in this Policy</strong>. We will respond to your request consistent with the applicable laws as soon as practicable after proper verification procedures.</p>\n<p><strong>VI.COOKIES</strong></p>\n<p>When you use the Services, we may collect and store relevant information about your access to the Services through the use of various technologies, and we will be able to recognize you when you access or revisit the Services and provide you with a better experience. By understanding your usage habits through these small data files which identify you, we are able to save you from the need to repeatedly enter in account information, and/or to help monitor the security of your account. These data files may be cookies, flash cookies, or other local storage provided by your browser or associated applications (collectively referred to as \"cookies\").</p>\n<p>If you do not want us to collect your information through the use of cookies, you can set your web browser to reject cookies from the Services. Each browser is different, so you should check your browser&rsquo;s &ldquo;Help&rdquo; menu to learn how to change your cookie preferences. Please understand that some of our services can only be achieved through the use of cookies, and if you reject or block such essential cookies from the Services, the relevant Services may not function as intended.</p>\n<p><strong>VII. CHANGES TO THIS PRIVACY POLICY</strong></p>\n<p>All changes to this Privacy Policy may be made any time and from time to time as we deem necessary and appropriate and will be effective from the time that they are posted on this page. When we make material changes to the Policy, we will give you a notice on our App or via our Services, prior to the change becoming effective. If you do not or no longer agree with such changes, please stop your access and use of the App, Site, and other Services. For minor changes made to the Policy, we will also update the &ldquo;Last Updated&rdquo; date at the top of this policy, which reflects the effective date of the policy. Users are strongly encouraged to check this Policy regularly for any changes.</p>\n<p><strong>VIII. GENERAL TERMS</strong></p>\n<p>1. Unsolicited Information</p>\n<p>You may provide us with ideas for new products, services or improvements to existing ones, and other voluntary and unsolicited submissions (collectively, &ldquo;Unsolicited Information&rdquo;). All Unsolicited Information shall be deemed to be non-confidential, and we shall be free to reproduce, use, disclose, and distribute such Unsolicited Information to others without limitation or attribution.</p>\n<p>2. Links to other Websites or Services</p>\n<p>We are not responsible for the practices employed by websites or services linked to or from our Services, including the information or content contained therein. When you use a link to go from our Services to another website or service, this Privacy Policy does not apply to such third-party websites or services. Your browsing and interaction on any third-party website or service, including such websites or services that have a link or advertisement on our website, are subject to that third party&rsquo;s own rules and policies.</p>\n<p>3. Notification Procedures</p>\n<p>It is our policy to provide notifications, whether such notifications are required by law or are for marketing or other business-related purposes, to you via email, written or hard copy notice, or through conspicuous posting of such notice on the Services, as determined by us in our sole discretion. We reserve the right to determine the form and means of providing notifications to you, provided that you may opt out of certain means of notification as described in this Privacy Policy.</p>\n<p>4. Children&rsquo;s Privacy</p>\n<p><strong>Our Services are not for users below age 18 and we do not knowingly collect personal information from children under the age of 18.</strong>&nbsp;If you are a parent or guardian of a child under the age of 18 and believe he or she has disclosed personal information to us, please immediately approach us via our contacts in this Policy. In the event that we learn that we have collected personal information from a child under age 18, we will halt the processing of such information and will take reasonable measures to promptly remove applicable information from our storage facilities.</p>\n<p>&nbsp;</p>\n<p><strong>Ⅸ.CONTACTING US</strong></p>\n<p>If you have any questions about this Privacy Policy or your rights under applicable data protection law including any complaints or questions in relation to the content of our product, you may contact our global Data Protection Officer (who may be named differently in different jurisdiction) via <a href=\"mailto:tilikecs@gmail.com\">tilikecs@gmail.com</a><strong>.</strong>&nbsp;Also, you may contact our local office at: 65 CHULIA STREET# 38-02 / 03 OCBC CENTRE SINGAPORE ( 049513）.</p>\n<p>We shall endeavor to address the any complaints or questions within ten (10) business days to one (1) month from receipt of the same.</p>\n<p>&nbsp;</p>\n<p><strong>Appendix 1 &ndash; List of Information Collection</strong></p>\n<table border=\"1\" cellspacing=\"0\">\n<tbody>\n<tr>\n<td width=\"88\">\n<p><strong>Type of information</strong></p>\n</td>\n<td width=\"128\">\n<p><strong>Information</strong></p>\n</td>\n<td width=\"173\">\n<p><strong>Purpose of collection</strong></p>\n</td>\n<td width=\"176\">\n<p><strong>Use of information</strong></p>\n</td>\n</tr>\n<tr>\n<td rowspan=\"4\" width=\"88\">\n<p>Account information</p>\n</td>\n<td width=\"128\">\n<p>Mobile phone number</p>\n</td>\n<td width=\"173\">\n<p>Account registration and login, sending SMS notifications</p>\n</td>\n<td width=\"176\">\n<p>When registering or logging in for the first time, sending SMS notification</p>\n</td>\n</tr>\n<tr>\n<td width=\"128\">\n<p>Email</p>\n</td>\n<td width=\"173\">\n<p>Account registration and login</p>\n</td>\n<td width=\"176\">\n<p>When registering and logging in for the first time</p>\n</td>\n</tr>\n<tr>\n<td width=\"128\">\n<p>Login name</p>\n</td>\n<td width=\"173\">\n<p>Account registration and login</p>\n</td>\n<td width=\"176\">\n<p>When registering and logging in for the first time</p>\n</td>\n</tr>\n<tr>\n   "children": "<div style=\"font-size: 14px; direction: ltr; color: #000; font-weight: 400; line-height: 1.2; font-family: system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',sans-serif; -webkit-tap-highlight-color: transparent;\" data-wrap=\"\">\n<div data-page-id=\"Qp2GdsHGFoWshvxiS6kcJY5mnkb\" data-lark-html-role=\"root\" data-docx-has-block-data=\"true\">\n<div class=\"ace-line ace-line old-record-id-doxcnTnUL1YIEJTpABsr3zef9oe\"><em>Latest updated: December, 2024</em></div>\n<div class=\"ace-line ace-line old-record-id-doxcnG6VQBE7NzIUkEoC5rJkToh\">&nbsp;</div>\n<div class=\"ace-line ace-line old-record-id-doxcnw5eTh8IRluOuxZiM5h2zvf\">Tilike attaches great importance to the protection of children. We strictly abide by the laws and regulations on the protection of minors in the country where our users are located, and strive to provide children with a suitable application experience. Any users violating this policy on protection of children&rsquo;s safety or other terms/ rules of Tilike regarding children&rsquo;s safety will be punished accordingly and may face further consequences including being reported to relevant law enforcement (authorities or agencies).</div>\n<div class=\"ace-line ace-line old-record-id-doxcnQvq7EaWXVOZe7pwO90q7Db\">&nbsp;</div>\n<div class=\"ace-line ace-line old-record-id-doxcniyD9TvheD7sVQXfk0TWEMe\">This Policy shall be effective upon publication and will automatically become part of the Terms of the Service between you and Tilike. All terms used in this Policy shall have the same meaning as those in the Terms of Service unless otherwise specified.</div>\n<div class=\"ace-line ace-line old-record-id-doxcnSacrbWAxE9vrXBuR0Zhruh\">&nbsp;</div>\n<div><strong>&nbsp;&nbsp;&nbsp;1. General Rule</strong></div>\n<div class=\"ace-line ace-line old-record-id-doxcnjWH1wXyjXWh4yrG6IQsxnf\">You must be at least 18 years old or the equivalent age as specified by law in your jurisdiction to use Tilike.</div>\n<div class=\"ace-line ace-line old-record-id-doxcnzPHbEPPYUCX6yksipUaUzf\">You are prohibited to intentionally provide incorrect age information age, make false representations regarding your age, or using any other method to cheat the APP about your age to get access to the App or Services.</div>\n<div class=\"ace-line ace-line old-record-id-doxcn8vmolKKjd5mqIhiXZOFZfd\">&nbsp;</div>\n<div><strong>&nbsp;&nbsp;&nbsp;2. Prohibition against Child Endangerment</strong></div>\n<div class=\"ace-line ace-line old-record-id-doxcnyZV7LuFmavE2CZVIef4WUT\">We have enforced both AI technology and manual approaches to detect any child endangerment behavior or content, including:</div>\n<ul class=\"list-bullet1\">\n<li>Sharing, creating, or distributing content involving child sexual abuse and sexual exploitation (whether in virtual form or in real life) (collectively referred to as &ldquo;<strong>CSAE</strong>&rdquo;), child nudity, or any other kind of child abuse.</li>\n<li>Kidnapping or abduction of children and any such information.</li>\n<li>Content of children engaging in illegal activities, violence, sexual behavior, pornographic, drug use, smoking, shameful or other inappropriate behaviors.</li>\n<li>Any predatory behavior towards children, such as:\n<div class=\"ace-line ace-line old-record-id-doxcnhNY6EdOCD2wlYIsuAyK7re\">&nbsp;&nbsp;A. Inappropriate interaction targeted at a child (for example, groping or caressing).</div>\n<div class=\"ace-line ace-line old-record-id-doxcnZMGCHz0tAhzv3pUNShQvne\">&nbsp;&nbsp;B. Child grooming (for example, befriending a child online to facilitate, either online or offline, sexual contact and/or exchanging sexual imagery with that child).</div>\n<div class=\"ace-line ace-line old-record-id-doxcnnF72OmTkk4fKndRvYkTvDb\">&nbsp;&nbsp;C. Sexualization of a minor (for example, imagery that depicts, encourages or promotes the sexual abuse of children or the portrayal of children in a manner that could result in the sexual exploitation of children).</div>\n<div class=\"ace-line ace-line old-record-id-doxcnRihC6NggyZjdacYWMEGd9f\">&nbsp;&nbsp;D. Sextortion (for example, threatening or blackmailing a child by using real or alleged access to a child&rsquo;s intimate images).</div>\n<div class=\"ace-line ace-line old-record-id-doxcnJ8K1ZzWg1DtzTeuJpfJ3Hc\">&nbsp;&nbsp;E. Trafficking of a child (for example, advertising or solicitation of a child for commercial sexual exploitation).</div>\n</li>\n<li>Any behavior or content that may cast negative effect against children or violating local laws and regulations on children protection.</li>\n</ul>\n<div class=\"ace-line ace-line old-record-id-doxcnoiNnxZQop75rAssJCtjfiK\">&nbsp;</div>\n<div><strong>&nbsp;&nbsp;&nbsp;3. Live Broadcasting involving Children</strong></div>\n<div class=\"ace-line ace-line old-record-id-doxcnZjsPbmjYfyUGAYLGQYPPXe\">Live broadcasting involving children or minors is strictly prohibited. We will conduct strict reviews on live broadcast content, focusing especially on whether minors are involved in the live broadcasts or appear in the live broadcast pictures. Once it is found that minors are participating in live broadcasts without permission, the live broadcasts will be immediately interrupted, and relevant accounts may be blocked or otherwise processed.</div>\n<div class=\"ace-line ace-line old-record-id-doxcntHgXN9KCrCQQ6MuIFHxSnh\">&nbsp;</div>\n<div><strong>&nbsp;&nbsp;&nbsp;4. Reporting Channels</strong></div>\n<div class=\"ace-line ace-line old-record-id-doxcnvTSgD72Nn6iJpAwsmNrqpf\">We provide users with comprehensive complaint and reporting channels for violations involving children, including:</div>\n<ul class=\"list-bullet1\">\n<li>Frontend reporting channels. You can find the tab \"Report Child Content\" in different occasions, ie. rooms, personal profiles, posts, etc.</li>\n<li>Customer service feedback channels. In FAQ section of Help Center, answer of the question \"What should I do if I find out about child abuse or exploitation?\" will guide you to report any suspected child abuse or exploitation behavior in the App.</li>\n<li>Email reporting. If you find any violation of the above rules or behavior involving child abuse, you may contact us at tilikechildreport@gmail.com and provide the details of the violation.</li>\n</ul>\n<div class=\"ace-line ace-line old-record-id-doxcnbqR9n1S2cVoPyjp5oAFwWd\">&nbsp;</div>\n<div><strong>&nbsp;&nbsp;&nbsp;5. Punishment Rules</strong></div>\n<div class=\"ace-line ace-line old-record-id-doxcnTN911Zj2OXuqd7rceu9ugc\">All violations of the Child Safety Policy will result in corresponding punishments, including but not limited to removal of the violating content, blocking of the violating account, etc.</div>\n<div class=\"ace-line ace-line old-record-id-doxcny3L8y3dWYegH4RcCrLdNjY\">&nbsp;</div>\n<div><strong>&nbsp;&nbsp;&nbsp;6. Reporting Mechanism</strong></div>\n<div class=\"ace-line ace-line old-record-id-doxcnASrC1nX3rzj72Shnx5P4Ub\">Despite the above, we will take appropriate action, which may include reporting to the App Store, the National Center for Missing &amp; Exploited Children (<strong>NCMEC)</strong> or any other local law enforcement (agencies or authorities), or child safety organization, if we are aware of violations.</div>\n<div class=\"ace-line ace-line old-record-id-doxcntcffF2IN0DLIaG4iGKpiAg\">&nbsp;</div>\n<div><strong>&nbsp;&nbsp;&nbsp;7. Transparency</strong></div>\n<div class=\"ace-line ace-line old-record-id-doxcnunTn8lsHYTubuTYIpoPqlf\">We will regularly update and disclose our child safety policies and practices according to relevant laws and regulations.</div>\n<div class=\"ace-line ace-line old-record-id-doxcnNdY0EFRi4bCyGjZSkDWfxd\">&nbsp;</div>\n<div><strong>&nbsp;&nbsp;&nbsp;8. Child Protection Agency Contact</strong></div>\n<div class=\"ace-line ace-line old-record-id-doxcnEDVdORuoQH3hAvdpUUtqVc\">You are also encouraged to contact your local authority or organization if you come across child abuse behaviors. We have listed some contacts below for your quick reference.</div>\n<ul class=\"list-bullet1\">\n<li>USA</li>\n</ul>\n<div class=\"ace-line ace-line old-record-id-doxcn7A1dIzCW2pHOBv0RW1twjf\">NCMEC: <u><a href=\"https://report.cybertip.org/\" data-lark-is-custom=\"true\">report.cybertip.org/</a></u></div>\n<ul class=\"list-bullet1\">\n<li>Brazil</li>\n</ul>\n<div class=\"ace-line ace-line old-record-id-doxcncxBTos8JmYtSPBnepdAqwe\">SaferNet Brasil: <u><a href=\"http://new.safernet.org.br/\" data-lark-is-custom=\"true\">new.safernet.org.br</a></u></div>\n<ul class=\"list-bullet1\">\n<li>India</li>\n</ul>\n<div class=\"ace-line ace-line old-record-id-doxcndVFOzCTRNzTYE1Vi3Jtgyf\">IWF India reporting portal: <u><a href=\"https://report.iwf.org.uk/in\" data-lark-is-custom=\"true\">https://report.iwf.org.uk/in</a></u></div>\n<ul class=\"list-bullet1\">\n<li>Indonesia</li>\n</ul>\n<div class=\"ace-line ace-line old-record-id-doxcns1jYR08XBczKr8JhsK6uXe\">TePSA Kemensos: <u><a href=\"http://www.facebook.com/TePSAKEMENSOS/\" data-lark-is-custom=\"true\">www.facebook.com/TePSAKEMENSOS/</a></u></div>\n<ul class=\"list-bullet1\">\n<li>Thailand</li>\n</ul>\n<div class=\"ace-line ace-line old-record-id-doxcnWX56ThVZIzCBiDjDKnLg8f\">Childline Thailand 1387: <u><a href=\"https://childlinethailand.org/\" data-lark-is-custom=\"true\">https://childlinethailand.org/</a></u></div>\n<ul class=\"list-bullet1\">\n<li>Vietnam</li>\n</ul>\n<div class=\"ace-line ace-line old-record-id-doxcnKrupTYhjXKgSJx6VogWbmb\">Child Helpline Vietnam 111: <u><a href=\"http://tongdai111.vn/\" data-lark-is-custom=\"true\">http://tongdai111.vn/</a></u></div>\n<div class=\"image-uploaded gallery old-record-id-doxcnnyv9DDrEI57zWGJLFKiY9d\" data-type=\"image\" data-ace-gallery-json=\"{&quot;items&quot;:[{&quot;uuid&quot;:&quot;6267f7db-69b3-4b9d-aea9-ac268dadeb8b&quot;,&quot;height&quot;:414.30337078651684,&quot;width&quot;:482,&quot;currHeight&quot;:414.30337078651684,&quot;currWidth&quot;:482,&quot;natrualHeight& <script>// Two decoders overlap the tail after 6 s with the next clip's first frames.
class HeroVideoController {
  constructor(videos, options={}) {
    this.videos=videos;this.options=options;this.front=0;this.phase='idle';
    this.running=false;this.destroyed=false;this.raf=null;this.token=0;
    this.brandRevealed=Boolean(options.brandRevealed);
    videos.forEach(v=>{v.muted=true;v.loop=false;v.playsInline=true;v.style.opacity='1';});
    this.paint();
  }
  paint(){this.videos.forEach((v,i)=>v.style.zIndex=i===this.front?'2':'1');}
  revealBrand(duration){if(!this.brandRevealed){this.brandRevealed=true;this.options.onBrandReveal?.(duration);}}
  async resume(){
    if(this.destroyed||this.running)return;this.running=true;const token=++this.token;
    try{
      if(this.phase==='fading')await Promise.all(this.videos.map(v=>v.play()));
      else await this.videos[this.front].play();
      if(!this.running||this.destroyed||token!==this.token){if(!this.running)this.videos.forEach(v=>v.pause());return;}
      this.options.onPlaying?.();this.schedule();
    }catch(error){if(token===this.token){this.running=false;this.options.onBlocked?.(error);}}
  }
  pause(){this.running=false;++this.token;cancelAnimationFrame(this.raf);this.raf=null;this.videos.forEach(v=>v.pause());}
  schedule(){if(this.running&&!this.destroyed&&this.raf===null)this.raf=requestAnimationFrame(()=>{this.raf=null;this.step();this.schedule();});}
  async startNext(){
    if(this.phase!=='idle'||!this.running||this.destroyed)return;
    const next=this.videos[1-this.front];this.phase='starting';next.currentTime=0;next.style.opacity='1';
    const token=this.token;
    try{
      await next.play();
      if(this.destroyed||!this.running||token!==this.token){next.pause();if(!this.destroyed)this.phase='idle';return;}
      this.phase='fading';
    }catch(error){this.phase='idle';this.pause();this.options.onBlocked?.(error);}
  }
  step(){
    if(this.destroyed||!this.running)return;
    const front=this.videos[this.front],duration=front.duration;
    if(!Number.isFinite(duration)||duration<=0)return;
    const fadeStart=Math.min(6,Math.max(0,duration-.3));
    const fadeDuration=Math.max(.05,duration-fadeStart);
    if(front.currentTime>=fadeStart){
      this.revealBrand(fadeDuration);
      if(this.phase==='idle')this.startNext();
    }
    if(this.phase==='fading'){
      const alpha=Math.max(0,Math.min(1,(front.currentTime-fadeStart)/fadeDuration));
      front.style.opacity=String(1-alpha);
      // Keep the incoming decoder at its current time: do not restart it here.
      if(alpha>=.995||front.ended){
        const outgoing=this.front;this.front=1-this.front;this.phase='idle';
        this.paint();this.videos[this.front].style.opacity='1';
        this.videos[outgoing].pause();this.videos[outgoing].style.opacity='1';this.videos[outgoing].currentTime=0;
        this.options.onLoop?.();
      }
    }
  }
  destroy(){this.pause();this.destroyed=true;}
}

function fitMobileHome(force=false){
 const stage=$('.home-stage'),viewport=$('.home-window');if(!stage||!viewport||window.innerWidth>680)return;
 const key=[viewport.clientWidth,viewport.clientHeight,lang].join(':');if(!force&&key===homeFitKey)return;homeFitKey=key;
 const compact=viewport.clientHeight<350;stage.style.setProperty('--mobile-title-font',compact?'26px':'29px');stage.style.setProperty('--mobile-body-font',compact?'13px':'15px');
 for(const name of ['--copy-title','--copy-body','--home-copy-height'])stage.style.removeProperty(name);
 const maxima={title:0,body:0};
 $$('.home-slide:not(.loop-clone)').forEach(slide=>{const copy=$('.hero-copy,.scene-copy',slide);if(!copy)return;for(const [name,selector] of [['title','h1,h2'],['body','.hero-description,.scene-copy > p']]){const el=$(selector,copy);if(el)maxima[name]=Math.max(maxima[name],Math.ceil(el.getBoundingClientRect().height));}});
 for(const name of ['title','body'])stage.style.setProperty('--copy-'+name,maxima[name]+'px');
 stage.style.setProperty('--home-copy-height',(maxima.title+maxima.body+8)+'px');
}
function observeHomeLayout(){

 if(activePage!=='home')return;

 requestAnimationFrame(()=>fitMobileHome(true));document.fonts?.ready.then(()=>fitMobileHome(true));
}

}
function playOpening(force=false){
 if(!force&&openingPlayed)return;openingPlayed=true;clearTimeout(openingTimer);document.body.classList.remove('opening');
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 void document.body.offsetHeight;document.body.classList.add('opening');openingTimer=setTimeout(()=>document.body.classList.remove('opening'),1400);
}
function prepareHomeLoop(){
 const deck=$('.home-deck');if(!deck||$('.loop-clone',deck))return;
 const originals=$$('.home-slide',deck);
 for(const [source,prepend] of [[originals.at(-1),true],[originals[0],false]]){
  const clone=source.cloneNode(true);clone.classList.add('loop-clone');clone.removeAttribute('id');$$('[id]',clone).forEach(el=>el.removeAttribute('id'));$$('h1',clone).forEach(el=>{const title=document.createElement('div');title.className=el.className+' hero-loop-title';title.innerHTML=el.innerHTML;el.replaceWith(title);});$$('video',clone).forEach(v=>v.remove());clone.inert=true;clone.setAttribute('aria-hidden','true');
  if(prepend)deck.prepend(clone);else deck.append(clone);
 }
 deck.addEventListener('transitionend',event=>{if(event.target===deck&&event.propertyName==='transform')settleLoop();});
}
function deckTransform(position){return window.innerWidth<=680?`translate3d(${-position*100}%,0,0)`:`translate3d(0,${-position*100}%,0)`;}
function settleLoop(){
 clearTimeout(loopTimer);loopTimer=null;const deck=$('.home-deck');if(!deck)return;
 if(deck.dataset.wrapping!=='true')return;deck.dataset.wrapping='false';deck.style.transition='none';deck.style.transform=deckTransform(homeSlide+1);void deck.offsetHeight;
 requestAnimationFrame(()=>{if(deck.isConnected)deck.style.transition='';});
}
function clearHomeAdvance(){clearTimeout(autoNextTimer);autoNextTimer=null;}
function autoAdvanceAllowed(){return !AUTO_ADVANCE_PAUSED&&activePage==='home'&&!document.hidden&&!$('#dialog-root').firstElementChild&&!$('#mobile-nav')?.classList.contains('open')&&!touchStart&&!(window.visualViewport?.scale>1.01);}
function scheduleHomeAdvance(){
 clearHomeAdvance();if(!autoAdvanceAllowed())return;
 if(homeSlide===0&&!homeVideoLapComplete)return;
 const videoSeconds=heroPlayer?.videos[0]?.duration;
 const fullScreenDuration=(Number.isFinite(videoSeconds)&&videoSeconds>0?videoSeconds:6.708333)*1000+1000;
 const slide=homeSlide,delay=slide===0?1000:fullScreenDuration;
 autoNextTimer=setTimeout(()=>{autoNextTimer=null;if(autoAdvanceAllowed()&&homeSlide===slide)setHomeSlide(slide+1,true);},delay);
}
function setHomeSlide(index,loop=false){
 clearHomeAdvance();clearTimeout(loopTimer);loopTimer=null;const previous=homeSlide;homeSlide=((index%screenTotal)+screenTotal)%screenTotal;if(homeSlide===0&&previous!==0){homeVideoLapComplete=false;disposeHeroVideo();}const deck=$('.home-deck');if(!deck)return;
 prepareHomeLoop();const wrap=loop&&(index<0||index>=screenTotal)&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
 deck.dataset.wrapping=String(wrap);deck.style.transition='';deck.style.transform=deckTransform(wrap?(index>=screenTotal?screenTotal+1:0):homeSlide+1);
 if(wrap)loopTimer=setTimeout(settleLoop,680);
 $$('.home-slide:not(.loop-clone)').forEach((el,i)=>{if(i!==homeSlide&&el.contains(document.activeElement))$('#main-content').focus({preventScroll:true});el.setAttribute('aria-hidden',String(i!==homeSlide));el.inert=i!==homeSlide;el.classList.toggle('is-active',i===homeSlide);});
 $$('[data-slide]').forEach((el,i)=>{el.classList.toggle('active',i===homeSlide);el.setAttribute('aria-current',i===homeSlide?'true':'false');});
 $('.home-stage').dataset.screen=String(homeSlide);requestAnimationFrame(()=>{updateVideoSize();fitMobileHome();const nav=$('.screen-nav'),selected=$('.screen-nav button.active');if(nav&&selected&&nav.scrollWidth>nav.clientWidth&&typeof nav.scrollTo==='function')nav.scrollTo({left:selected.offsetLeft-(nav.clientWidth-selected.offsetWidth)/2,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});});
 $('#screen-status').textContent=[data().nav.home,...data().home.scenes.map(s=>s.title)][homeSlide];
 syncHeroVideo();scheduleHomeAdvance();
}
function moveSlide(step){const now=Date.now();if(now-lastSlideAt<720)return;lastSlideAt=now;setHomeSlide(homeSlide+step,true);}
function disposeHeroVideo(){if(heroPlayer){heroPlayer.destroy();heroPlayer=null;}}
function freezeHeroLoopPreview(){
 if(!heroPlayer)return;const videos=heroPlayer.videos;if(!videos.some(v=>v.readyState>=2))return;
 $$('.loop-clone .hero-video-stage').forEach(stage=>{
  const canvas=document.createElement('canvas');canvas.className='hero-loop-freeze';canvas.width=videos[0].videoWidth;canvas.height=videos[0].videoHeight;
  if(!canvas.width||!canvas.height)return;const ctx=canvas.getContext('2d');if(!ctx)return;
  const order=[videos[1-heroPlayer.front],videos[heroPlayer.front]];for(const v of order){if(v.readyState>=2){ctx.globalAlpha=Number(v.style.opacity||1);ctx.drawImage(v,0,0,canvas.width,canvas.height);}}
  stage.replaceChildren(canvas);
 });
}
function syncHeroVideo(){
 const frame=$('#hello .hero-media-video');if(!frame){disposeHeroVideo();return;}
 const source=window.innerWidth<=680?(HERO_MEDIA.portrait||HERO_MEDIA.landscape):(HERO_MEDIA.landscape||HERO_MEDIA.portrait);
 const videos=$$('video',frame);if(videos.length!==2)return;
 if(!heroPlayer||heroPlayer.videos[0]!==videos[0]||heroPlayer.source!==source){
  disposeHeroVideo();videos.forEach(v=>{v.src=source;v.muted=true;v.load();});
  heroPlayer=new HeroVideoController(videos,{brandRevealed:heroBrandRevealed,onBrandReveal:duration=>{
   heroBrandRevealed=true;$$('.hero-brand-overlay').forEach(el=>{el.style.setProperty('--brand-fade-duration',duration+'s');el.classList.add('is-visible');});
  },onLoop:()=>{if(activePage==='home'&&homeSlide===0&&!homeVideoLapComplete){homeVideoLapComplete=true;scheduleHomeAdvance();}},onPlaying:()=>{frame.classList.add('has-video');$('.hero-play-fallback',frame).hidden=true;},onBlocked:()=>{$('.hero-play-fallback',frame).hidden=false;}});
  heroPlayer.source=source;
 }
 const active=activePage==='home'&&homeSlide===0&&!document.hidden;
 if(active&&(!matchMedia('(prefers-reduced-motion: reduce)').matches||heroUserStarted))heroPlayer.resume();
 else{freezeHeroLoopPreview();heroPlayer.pause();if(active)$('.hero-play-fallback',frame).hidden=false;}
}

function policyPage(key){const t=data(),p=t.policy;const current=['terms','privacy','children'].includes(key);const title=t.footer[key]||t.footer.terms;const body=current?`<p class="note">${p.sourceNote}</p><article class="legal-article" lang="en">${POLICIES[key]}</article><p class="draft-link">${external(LINKS[key],p.official+icon('arrow'),'text-link')}</p>`:`<p class="note">${p.draftNote}</p><h2 class="outline-heading">${p.outline}</h2><div class="outline-sections">${(OUTLINES[key]?.[lang]||OUTLINES[key]?.en||[]).map(([heading,text],i)=>`<section><h2>0${i+1}. ${heading}</h2><p>${text}</p></section>`).join('')}</div>${key==='cookies'?`<p class="draft-link"><button class="button secondary" data-action="cookies">${t.footer.settings}${icon('cookie')}</button></p>`:''}`;return intro(title,t.policyDescriptions[key],current?p.source:p.draftLabel)+`<section class="page-body"><div class="wrap policy-layout"><nav class="policy-nav" aria-label="Policies">${policyKeys.map(k=>link(k==='law'?'law-enforcement':'policy/'+k,t.footer[k],key===k?'active':'')).join('')}</nav><div>${body}<p style="margin-top:40px">${link('safety',p.back+icon('arrow'),'text-link')}</p></div></div></section>`;}
function render(){
  setMobileMenu(false);
  clearHomeAdvance();homeVideoLapComplete=false;
  disposeHeroVideo();
  clearTimeout(loopTimer);loopTimer=null;
  const previous=activePage;
  const parts=(location.hash.replace(/^#\/?/,'')||'home').split('?');
  let route=parts[0];const section=new URLSearchParams(parts[1]||'').get('section');
  if(!['home','about','help','contact','safety','law-enforcement',...policyKeys.filter(x=>x!=='law').map(x=>'policy/'+x)].includes(route))route='home';
  activePage=route;document.body.classList.toggle('home-mode',route==='home');document.body.classList.remove('motion-ready');
  if(route==='home'&&section&&slideIds.includes(section))homeSlide=slideIds.indexOf(section);else if(route==='home'&&previous!=='home')homeSlide=0;
  document.documentElement.lang=lang==='zh'?'zh-CN':lang;
  document.title=(route==='home'?'TiLike — '+(lang==='zh'?'相遇，让快乐多一点':lang==='hi'?'मिलें, लाइव आएँ और दोस्त बनाएँ':'Party, live stream and make friends'):(data().nav[route]||data().footer[route.split('/')[1]]||data().footer.law)+' — TiLike');
  renderHeader();renderFooter();
  $('#main-content').innerHTML=route==='home'?homePage():route==='about'?aboutPage():route==='help'?helpPage():route==='contact'?contactPage():route==='safety'?safetyPage():policyPage(route==='law-enforcement'?'law':route.split('/')[1]);
  if(route==='help')renderFaq();if(route==='home'){setHomeSlide(homeSlide);playOpening();}observeHomeLayout();
  if(observer)observer.disconnect();
  if(route!=='home'&&'IntersectionObserver' in window&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.body.classList.add('motion-ready');
    observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target);}}),{threshold:.08});
    $$('.reveal').forEach(el=>observer.observe(el));
  }
  requestAnimationFrame(()=>{
    if(route==='home'){if(section==='download')showDownload();}
    else if(section&&$('#'+CSS.escape(section)))$('#'+CSS.escape(section)).scrollIntoView({behavior:'auto',block:'start'});
    else window.scrollTo({top:0,behavior:'auto'});
    if(previous&&previous!==route)$('#main-content').focus({preventScroll:true});
  });
}

document.addEventListener('click',event=>{
 const anchor=event.target.closest('a[href]');if(anchor?.getAttribute('href')==='#/home?section=download'){event.preventDefault();setMobileMenu(false);showDownload();return;}
 const dot=event.target.closest('[data-slide]');if(dot){setHomeSlide(Number(dot.dataset.slide));return;}
 if(activePage==='home'&&anchor?.getAttribute('href')==='#/home'){event.preventDefault();setHomeSlide(0);setMobileMenu(false);scheduleHomeAdvance();return;}

 if(event.target.closest('.skip-link')){event.preventDefault();$('#main-content').focus();$('#main-content').scrollIntoView({block:'start'});return;}
 const category=event.target.closest('[data-category]');if(category){helpCategory=category.dataset.category;$$('[data-category]').forEach(el=>{el.classList.toggle('active',el===category);el.setAttribute('aria-pressed',String(el===category));});renderFaq();return;}
 if(event.target.closest('#menu-toggle')){setMobileMenu(!$('#mobile-nav').classList.contains('open'));return;}
 const action=event.target.closest('[data-action]')?.dataset.action;
 if(action==='start-hero-video'){heroUserStarted=true;syncHeroVideo();return;}
 if(action==='more-downloads'){showMoreDownloads(event.target.closest('[data-action=more-downloads]'));return;}
 if(action==='preview-download'){const destination=LINKS[event.target.closest('[data-channel]').dataset.channel];if(destination){window.location.assign(destination);}else{toast(downloadCopy().note);}return;}
 if(action==='close-dialog'||(action==='backdrop'&&event.target.classList.contains('dialog-backdrop'))){closeDialog();return;}
 if(action==='cookies'){showCookies();return;}
 if(action==='cookie-save'||action==='cookie-reject'){storage.set('tilike-preview-cookies',JSON.stringify({analytics:action==='cookie-save'&&$('#analytics-choice').checked,updatedAt:new Date().toISOString()}));closeDialog();toast(data().cookie.saved);return;}
 if(event.target.closest('#form-again')){render();return;}
 if(event.target.closest('#mobile-nav a'))setMobileMenu(false);
});
document.addEventListener('submit',event=>{if(event.target.id!=='contact-form')return;event.preventDefault();if(!event.target.checkValidity()){event.target.reportValidity();return;}$('#form-result').innerHTML=`<div class="form-result">${data().contact.success}</div><button class="text-link" id="form-again">${data().contact.again}${icon('arrow')}</button>`;event.target.hidden=true;$('#form-result').scrollIntoView({block:'center',behavior:'smooth'});});
document.addEventListener('keydown',event=>{if(!$('#dialog-root').firstElementChild){if(event.key==='Escape'&&$('#mobile-nav')?.classList.contains('open')){setMobileMenu(false);$('#menu-toggle').focus();}return;}if(event.key==='Escape'){event.preventDefault();closeDialog();return;}if(event.key==='Tab'){const list=$$('a[href],button,input,select,textarea,[tabindex="0"]',$('#dialog-root')).filter(el=>!el.disabled);if(!list.length)return;const first=list[0],last=list.at(-1);if(event.shiftKey&&(document.activeElement===first||document.activeElement=== $('.dialog-backdrop section'))){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
function canNavigate(){return activePage==='home'&&!$('#dialog-root').firstElementChild&&!$('#mobile-nav')?.classList.contains('open');}
function needsInnerScroll(target,direction){const slide=target.closest?.('.home-slide');return !!slide&&slide.scrollHeight>slide.clientHeight+2&&(direction>0?slide.scrollTop+slide.clientHeight<slide.scrollHeight-2:slide.scrollTop>2);}
document.addEventListener('wheel',event=>{
 if(!canNavigate()||!event.target.closest('.home-stage')||event.ctrlKey||window.visualViewport?.scale>1.01)return;
 if(window.innerWidth<=680||needsInnerScroll(event.target,Math.sign(event.deltaY)))return;
 event.preventDefault();if(wheelQuiet)return;wheelAmount+=event.deltaMode===1?event.deltaY*16:event.deltaY;if(Math.abs(wheelAmount)<35)return;moveSlide(Math.sign(wheelAmount));wheelAmount=0;wheelQuiet=1;
},{passive:false});
let wheelTimer;document.addEventListener('wheel',()=>{clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>{wheelQuiet=0;wheelAmount=0;},200);},{passive:true});
document.addEventListener('keydown',event=>{if(!canNavigate()||event.target.closest?.('input,select,textarea,button,a')||window.visualViewport?.scale>1.01)return;const keys=window.innerWidth<=680?['ArrowLeft','ArrowRight']:['ArrowUp','ArrowDown'];if([keys[0],keys[1],'PageDown','PageUp','Home','End'].includes(event.key)){if(needsInnerScroll(event.target,event.key===keys[0]||event.key==='PageUp'?-1:1)&&!['Home','End'].includes(event.key))return;event.preventDefault();if(event.key==='Home')setHomeSlide(0);else if(event.key==='End')setHomeSlide(screenTotal-1);else moveSlide(event.key===keys[0]||event.key==='PageUp'?-1:1);}});
document.addEventListener('touchstart',event=>{
 touchStart=null;if(!canNavigate()||!event.target.closest('.home-stage')||event.target.closest('button,a,input,select,textarea'))return;
 if(event.touches.length!==1||window.visualViewport?.scale>1.01)return;
 const point=event.touches[0];if(point.clientX<28||point.clientX>window.innerWidth-28)return;
 touchStart={x:point.clientX,y:point.clientY,cancelled:false};
},{passive:true});
document.addEventListener('touchmove',event=>{
 if(!touchStart)return;if(event.touches.length!==1||window.visualViewport?.scale>1.01){touchStart=null;return;}
 const dx=touchStart.x-event.touches[0].clientX,dy=touchStart.y-event.touches[0].clientY;
 if(window.innerWidth<=680&&Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx))touchStart.cancelled=true;
},{passive:true});
document.addEventListener('touchend',event=>{
 if(!touchStart)return;const start=touchStart;touchStart=null;if(start.cancelled||!canNavigate()||!event.changedTouches.length||window.visualViewport?.scale>1.01)return;
 const dx=start.x-event.changedTouches[0].clientX,dy=start.y-event.changedTouches[0].clientY;
 if(window.innerWidth<=680){if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4)moveSlide(Math.sign(dx));}
 else if(Math.abs(dy)>50&&Math.abs(dy)>Math.abs(dx)*1.4&&!needsInnerScroll(event.target,Math.sign(dy)))moveSlide(Math.sign(dy));
},{passive:true});
document.addEventListener('touchcancel',()=>{touchStart=null;},{passive:true});
window.addEventListener('resize',()=>{if(window.innerWidth>680)setMobileMenu(false);if(activePage==='home')setHomeSlide(homeSlide);});
document.addEventListener('visibilitychange',()=>{syncHeroVideo();scheduleHomeAdvance();});
document.addEventListener('touchstart',event=>{if(event.target.closest?.('.home-stage'))clearHomeAdvance();},{passive:true});
document.addEventListener('touchend',scheduleHomeAdvance,{passive:true});
document.addEventListener('touchcancel',scheduleHomeAdvance,{passive:true});
window.visualViewport?.addEventListener('resize',scheduleHomeAdvance);
window.addEventListener('hashchange',()=>{closeDialog();render();});

// Keep source text slots and navigation widths fixed when product copy changes.
function alignProductSlots(){
 const reference=ALIGN_REFERENCE[lang];if(!reference)return;
 const issues=[];
 function reserve(element,referenceHtml,availableWidth){
  if(!element)return;
  element.style.removeProperty('height');element.style.removeProperty('min-height');
  const width=availableWidth||element.getBoundingClientRect().width;if(!width)return;
  const probe=element.cloneNode(false);probe.innerHTML=referenceHtml;
  probe.setAttribute('aria-hidden','true');probe.inert=true;
  Object.assign(probe.style,{position:'fixed',left:'0',top:'-99999px',width:width+'px',height:'auto',minHeight:'0',maxHeight:'none',visibility:'hidden',pointerEvents:'none'});
  element.parentElement.appendChild(probe);
  const height=probe.getBoundingClientRect().height,referenceScrollHeight=probe.scrollHeight;probe.remove();
  element.style.height=height+'px';element.style.minHeight=height+'px';
  if(element.scrollHeight>referenceScrollHeight+2)issues.push({selector:element.tagName+'.'+element.className,text:element.textContent,referenceHeight:height,actualHeight:element.scrollHeight});
 }
 reserve($('.entity-name'),'Chivalyouth Technology PTE.LTD.');
 reserve($('.entity-address'),'Registered office: 65 CHULIA STREET #38-02/03 OCBC CENTRE, SINGAPORE 049513',$('.entity-address')?.parentElement.clientWidth);
 if(activePage==='home'){
  reserve($('#hello h1'),reference.home.title);reserve($('#hello .hero-description'),reference.home.description);
  reference.home.scenes.forEach(s=>{
   reserve($('#'+s.id+' .scene-copy h2'),s.title);reserve($('#'+s.id+' .scene-copy>p'),s.description);
  });
  const referenceLabels=[reference.nav.home,...reference.home.scenes.map(s=>s.title)];
  $$('.screen-nav button').forEach((button,i)=>{
   button.style.removeProperty('width');button.style.removeProperty('min-width');
   const probe=button.cloneNode(true);$('span',probe).textContent=referenceLabels[i];
   probe.setAttribute('aria-hidden','true');probe.inert=true;
   Object.assign(probe.style,{position:'fixed',left:'0',top:'-99999px',width:'auto',visibility:'hidden',pointerEvents:'none'});
   button.parentElement.appendChild(probe);const width=probe.getBoundingClientRect().width;probe.remove();
   button.style.width=width+'px';button.style.minWidth=width+'px';
  });
  fitMobileHome(true);
 }else{
  let introText=reference[activePage]?.intro;
  if(activePage.startsWith('policy/'))introText=reference.policyDescriptions[activePage.split('/')[1]];
  if(activePage==='law-enforcement')introText=reference.policyDescriptions.law;
  if(introText)reserve($('.page-intro>.wrap>p'),introText);
  if(activePage==='about'){
   reserve($('.about-copy h2'),reference.about.heading);
   $$('.about-copy>p').forEach((p,i)=>reserve(p,reference.about.paragraphs[i]));
   $$('.about-values article').forEach((article,i)=>{reserve($('h3',article),reference.about.values[i][0]);reserve($('p',article),reference.about.values[i][1]);});
  }
  reserve($('.footer-brand>p'),reference.footer.tagline);
  if(window.innerWidth<=680)reserve($('.download-band p'),reference.home.downloadText);
  if(activePage==='safety'){
   $$('.policy-row p').forEach((p,i)=>reserve(p,reference.policyDescriptions[['terms','privacy','children','community','bullying','cookies','law'][i]]));
  }
  if(activePage==='contact'){
   $$('.contact-choice h2').forEach((h,i)=>reserve(h,i===0?reference.contact.supportTitle:reference.contact.businessTitle));
   const email=$('.contact-choice a[href^="mailto:"]');
   if(email){
    // v19 mail control measured at both required viewports, with bundled fonts.
    const width=lang==='hi'?215.546875:216.234375;
    email.style.width=width+'px';email.style.justifyContent='space-between';
   }
  }
 }
 window.TILIKE_ALIGNMENT={sourceVersion:19,issues};
 document.documentElement.setAttribute('data-alignment-issues',JSON.stringify(issues));
 document.documentElement.setAttribute('data-alignment-language',lang);
 document.documentElement.setAttribute('data-alignment-width',String(window.innerWidth));
}
const renderAlignedProduct=render;
render=function(){renderAlignedProduct();requestAnimationFrame(alignProductSlots);document.fonts?.ready.then(alignProductSlots);};
window.addEventListener('resize',()=>requestAnimationFrame(alignProductSlots));

render();
})();
